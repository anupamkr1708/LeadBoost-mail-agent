[pytest]
addopts = -m "not integration"
markers =
    integration: requires real external services (Groq/SMTP/IMAP/PostgreSQL) and network access. Never required for ordinary deterministic CI -- see docs/FINAL_PRODUCTION_READINESS.md for how to run these locally.
    postgres: requires a real PostgreSQL instance (a subset of `integration`, called out separately because it specifically verifies row-locking/concurrency guarantees that SQLite cannot).
